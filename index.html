  <style amp-boilerplate>body{-webkit-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-moz-animation:-amp-start 8s steps(1,end) 0s 1 normal both;-ms-animation:-amp-start 8s steps(1,end) 0s 1 normal both;animation:-amp-start 8s steps(1,end) 0s 1 normal both}@-webkit-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-moz-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-ms-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@-o-keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}@keyframes -amp-start{from{visibility:hidden}to{visibility:visible}}</style><noscript><style amp-boilerplate>body{-webkit-animation:none;-moz-animation:none;-ms-animation:none;animation:none}</style></noscript>

  <style amp-custom>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

    html{-webkit-text-size-adjust:100%}

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:16px 14px;
      background:#fff;
      color:#0f172a;
      line-height:1.5;
      overflow-x:hidden;
      position:relative;
    }

    .grid-bg{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(148,163,184,.35) 1px,transparent 1px),
        linear-gradient(90deg,rgba(148,163,184,.35) 1px,transparent 1px);
      background-size:24px 24px;
      background-position:0 0;
      animation:gridMove 8s linear infinite;
    }

    .grid-vignette{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;
      background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 0%,rgba(255,255,255,.5) 55%,rgba(255,255,255,.9) 100%);
    }

    @keyframes gridMove{
      0%{background-position:0 0}
      100%{background-position:24px 24px}
    }

    .card{
      width:100%;
      max-width:360px;
      background:#fff;
      border-radius:18px;
      padding:22px 20px 18px;
      text-align:center;
      position:relative;
      z-index:1;
      box-shadow:
        0 0 0 1px rgba(148,163,184,.3),
        0 0 18px rgba(148,163,184,.6),
        0 0 40px rgba(148,163,184,.5),
        0 0 80px rgba(203,213,225,.6),
        0 12px 32px rgba(15,23,42,.08);
    }

    .logo-badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      background:linear-gradient(135deg,#0f172a,#334155);
      color:#fff;
      font-size:11px;
      font-weight:700;
      letter-spacing:.5px;
      padding:5px 12px;
      border-radius:999px;
      margin-bottom:12px;
      text-transform:uppercase;
    }

    .logo-dot{
      display:inline-block;
      width:7px;
      height:7px;
      border-radius:50%;
      background:#22c55e;
      box-shadow:0 0 8px #22c55e;
      animation:pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{opacity:1;transform:scale(1)}
      50%{opacity:.6;transform:scale(1.3)}
    }

    .title{
      font-size:19px;
      font-weight:800;
      color:#0f172a;
      letter-spacing:-.02em;
      line-height:1.25;
      margin-bottom:6px;
    }

    .subtitle{
      font-size:12.5px;
      color:#64748b;
      line-height:1.5;
      margin-bottom:14px;
    }

    .image-wrap{
      width:100%;
      border-radius:14px;
      overflow:hidden;
      margin-bottom:16px;
      background:#f1f5f9;
      position:relative;
      box-shadow:0 4px 14px rgba(15,23,42,.08);
    }

    .image-wrap amp-img{
      display:block;
    }

    .actions{
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .btn{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:100%;
      min-height:46px;
      padding:12px 18px;
      border-radius:12px;
      font-family:inherit;
      font-size:14px;
      font-weight:700;
      letter-spacing:.01em;
      text-decoration:none;
      cursor:pointer;
      border:none;
      -webkit-appearance:none;
      appearance:none;
    }

    .btn-login{
      background:#fff;
      color:#0f172a;
      border:2px solid #e2e8f0;
      box-shadow:0 1px 4px rgba(15,23,42,.05);
    }

    .btn-daftar{
      background:linear-gradient(135deg,#0f172a 0%,#1e293b 100%);
      color:#fff;
      box-shadow:
        0 6px 16px rgba(15,23,42,.22),
        inset 0 1px 0 rgba(255,255,255,.1);
    }

    .btn svg{
      width:17px;
      height:17px;
      flex-shrink:0;
      stroke:currentColor;
      fill:none;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .footer-note{
      margin-top:14px;
      font-size:11px;
      color:#94a3b8;
      line-height:1.5;
      letter-spacing:.2px;
    }

    @media (max-width:360px){
      body{padding:12px 10px}
      .card{padding:18px 16px 14px;border-radius:16px}
      .title{font-size:17px}
      .subtitle{font-size:12px}
      .btn{min-height:44px;font-size:13.5px}
      .grid-bg{background-size:20px 20px}
    }
  </style>

<body>

  <div class="grid-bg"></div>
  <div class="grid-vignette"></div>

  <main class="card">

    <span class="logo-badge">
      <span class="logo-dot"></span>
      PANDAWA79
    </span>

    <h1 class="title">Masuk &amp; Daftar</h1>
    <p class="subtitle">Play with PANDAWA79</p>

    <div class="image-wrap">
      <amp-img
        src="https://crystalcleansolution.com/banner.webp"
        width="600"
        height="600"
        layout="responsive"
        alt="PANDAWA79"
        data-hero
        noloading>
      </amp-img>
    </div>

    <div class="actions">
      <a href="https://pandawa79ok.com/"
         class="btn btn-login"
         aria-label="Masuk ke akun PANDAWA79">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Masuk
      </a>

      <a href="https://pandawa79ok.com/"
         class="btn btn-daftar"
         aria-label="Daftar akun PANDAWA79 baru">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        Daftar Sekarang
      </a>
    </div>

    <p class="footer-note">Copyright PANDAWA79 x MR.J</p>

  </main>

</body>
